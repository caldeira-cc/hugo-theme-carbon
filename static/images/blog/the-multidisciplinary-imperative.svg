<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#161616"/>
  <defs>
    <pattern id="grid4" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#262626" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#grid4)"/>
  
  <rect x="30" y="30" width="740" height="390" fill="none" stroke="#393939" stroke-width="1"/>
  <line x1="30" y1="70" x2="770" y2="70" stroke="#393939" stroke-width="1"/>
  <line x1="30" y1="380" x2="770" y2="380" stroke="#393939" stroke-width="1"/>
  
  <text x="45" y="55" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#8d8d8d" letter-spacing="1.5">FIG 04.1 // MULTIDISCIPLINARY SYNTHESIS TOPOLOGY</text>
  <text x="755" y="55" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#f4f4f4" text-anchor="end">SYS.THEORY-3x</text>
  
  <!-- Intersecting Discipline Triad -->
  <g transform="translate(400, 230)">
    <!-- Circle 1: Political Science -->
    <circle cx="-60" cy="-35" r="95" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="-90" y="-70" font-family="'IBM Plex Sans', sans-serif" font-weight="600" font-size="13" fill="#ffffff">POLITICAL THEORY</text>
    <text x="-90" y="-52" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#8d8d8d">Legitimacy &amp; Coercion</text>
    
    <!-- Circle 2: Systems Architecture -->
    <circle cx="60" cy="-35" r="95" fill="none" stroke="#8d8d8d" stroke-width="2"/>
    <text x="90" y="-70" font-family="'IBM Plex Sans', sans-serif" font-weight="600" font-size="13" fill="#ffffff" text-anchor="end">SYSTEMS ARCH</text>
    <text x="90" y="-52" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#8d8d8d" text-anchor="end">Resilience &amp; Scale</text>
    
    <!-- Circle 3: Design Engineering -->
    <circle cx="0" cy="55" r="95" fill="none" stroke="#525252" stroke-width="2"/>
    <text x="0" y="115" font-family="'IBM Plex Sans', sans-serif" font-weight="600" font-size="13" fill="#ffffff" text-anchor="middle">DESIGN COGNITION</text>
    <text x="0" y="132" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#8d8d8d" text-anchor="middle">Clarity &amp; Accessibility</text>
    
    <!-- Central Intersection Anchor -->
    <circle cx="0" cy="0" r="16" fill="#ffffff"/>
    <text x="0" y="4" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="700" fill="#161616" text-anchor="middle">Σ</text>
  </g>
  
  <text x="45" y="405" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#6f6f6f">INTERSECTION: POLITICAL_SCIENCE ∩ COMPUTATION ∩ DESIGN</text>
  <text x="755" y="405" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#8d8d8d" text-anchor="end">SYNTHESIS: OPTIMAL</text>
</svg>
