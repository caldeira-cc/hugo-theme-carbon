    <circle cx="-160" cy="0" r="5" fill="#8d8d8d"/>
    <circle cx="160" cy="0" r="5" fill="#8d8d8d"/>
    
    <!-- Worldline 3 -->
    <path d="M -160,80 C -80,80 -80,80 0,80 C 80,80 80,-80 160,-80" fill="none" stroke="#525252" stroke-width="2.5"/>
    <circle cx="-160" cy="80" r="5" fill="#525252"/>
    <circle cx="160" cy="-80" r="5" fill="#525252"/>
    
    <!-- Braiding Matrix Frame -->
    <rect x="-60" y="-100" width="120" height="200" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="0" y="115" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#f4f4f4" text-anchor="middle">BRAID OPERATOR σ₁σ₂</text>
