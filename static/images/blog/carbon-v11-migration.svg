<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#161616"/>
  <defs>
    <pattern id="grid10" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#262626" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#grid10)"/>
  
  <rect x="30" y="30" width="740" height="390" fill="none" stroke="#393939" stroke-width="1"/>
  <line x1="30" y1="70" x2="770" y2="70" stroke="#393939" stroke-width="1"/>
  <line x1="30" y1="380" x2="770" y2="380" stroke="#393939" stroke-width="1"/>
  
  <text x="45" y="55" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#8d8d8d" letter-spacing="1.5">FIG 10.1 // IBM CARBON DESIGN SYSTEM v11 TOKEN TAXONOMY</text>
  <text x="755" y="55" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#f4f4f4" text-anchor="end">DESIGN.CARBON-v11</text>
  
  <!-- 16-Column 2x Grid & Token Layers -->
  <g transform="translate(100, 130)">
    <!-- 16 Column Guides -->
    <g opacity="0.25">
      <rect x="0" y="0" width="30" height="180" fill="#ffffff"/>
      <rect x="38" y="0" width="30" height="180" fill="#ffffff"/>
      <rect x="76" y="0" width="30" height="180" fill="#ffffff"/>
      <rect x="114" y="0" width="30" height="180" fill="#ffffff"/>
      <rect x="152" y="0" width="30" height="180" fill="#ffffff"/>
      <rect x="190" y="0" width="30" height="180" fill="#ffffff"/>
      <rect x="228" y="0" width="30" height="180" fill="#ffffff"/>
      <rect x="266" y="0" width="30" height="180" fill="#ffffff"/>
      <rect x="304" y="0" width="30" height="180" fill="#ffffff"/>
      <rect x="342" y="0" width="30" height="180" fill="#ffffff"/>
      <rect x="380" y="0" width="30" height="180" fill="#ffffff"/>
      <rect x="418" y="0" width="30" height="180" fill="#ffffff"/>
      <rect x="456" y="0" width="30" height="180" fill="#ffffff"/>
      <rect x="494" y="0" width="30" height="180" fill="#ffffff"/>
      <rect x="532" y="0" width="30" height="180" fill="#ffffff"/>
      <rect x="570" y="0" width="30" height="180" fill="#ffffff"/>
    </g>
    
    <!-- Token Structure Overlay Cards -->
    <rect x="40" y="30" width="240" height="120" fill="#262626" stroke="#ffffff" stroke-width="2"/>
    <text x="60" y="60" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#8d8d8d">CSS CUSTOM PROPERTIES</text>
    <text x="60" y="80" font-family="'IBM Plex Sans', sans-serif" font-weight="600" font-size="14" fill="#ffffff">--cds-layer-01</text>
    <text x="60" y="100" font-family="'IBM Plex Sans', sans-serif" font-weight="600" font-size="14" fill="#ffffff">--cds-text-primary</text>
    <text x="60" y="125" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#8d8d8d">DYNAMIC INJECTION // ZERO JS RUNTIME</text>
    
    <rect x="320" y="30" width="240" height="120" fill="#393939" stroke="#ffffff" stroke-width="2"/>
    <text x="340" y="60" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#8d8d8d">2X MINI-UNIT &amp; BASELINE</text>
    <text x="340" y="80" font-family="'IBM Plex Sans', sans-serif" font-weight="600" font-size="14" fill="#ffffff">8px Grid // 4px Baseline</text>
    <text x="340" y="100" font-family="'IBM Plex Sans', sans-serif" font-weight="600" font-size="14" fill="#ffffff">Type Scale: 12px - 54px</text>
    <text x="340" y="125" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#8d8d8d">WCAG 2.1 AA ACCESSIBLE</text>
  </g>
  
  <text x="45" y="405" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#6f6f6f">DESIGN SYSTEM: IBM_CARBON_V11 // MIGRATION: 100% COMPLETE</text>
  <text x="755" y="405" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#8d8d8d" text-anchor="end">TOKENS: 48 VARS</text>
</svg>
