<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#161616"/>
  <defs>
    <pattern id="grid1" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#262626" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#grid1)"/>
  
  <!-- Technical Grid Framing -->
  <rect x="30" y="30" width="740" height="390" fill="none" stroke="#393939" stroke-width="1"/>
  <line x1="30" y1="70" x2="770" y2="70" stroke="#393939" stroke-width="1"/>
  <line x1="30" y1="380" x2="770" y2="380" stroke="#393939" stroke-width="1"/>
  
  <!-- Header Monospace Telemetry -->
  <text x="45" y="55" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#8d8d8d" letter-spacing="1.5">FIG 01.1 // PLANETARY STATECRAFT SUBSTRATE</text>
  <text x="755" y="55" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#f4f4f4" text-anchor="end">SYS.AUTONOMY-09</text>
  
  <!-- Global Sovereignty Concentric Rings -->
  <g transform="translate(400, 225)">
    <circle r="140" fill="none" stroke="#525252" stroke-width="1" stroke-dasharray="4 4"/>
    <circle r="100" fill="url(#fade1)" stroke="#8d8d8d" stroke-width="1.5"/>
    <circle r="60" fill="#262626" stroke="#f4f4f4" stroke-width="2"/>
    <circle r="20" fill="#ffffff"/>
    
    <!-- Coordinate Crosshairs -->
    <line x1="-160" y1="0" x2="160" y2="0" stroke="#525252" stroke-width="1"/>
    <line x1="0" y1="-160" x2="0" y2="160" stroke="#525252" stroke-width="1"/>
    
    <!-- Orbital Nodes & Vectors -->
    <g transform="rotate(30)">
      <line x1="0" y1="0" x2="140" y2="0" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="140" cy="0" r="6" fill="#ffffff"/>
      <rect x="155" y="-12" width="90" height="24" fill="#262626" stroke="#6f6f6f" stroke-width="1"/>
      <text x="200" y="4" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#f4f4f4" text-anchor="middle">NODE_EU_01</text>
    </g>
    
    <g transform="rotate(150)">
      <line x1="0" y1="0" x2="140" y2="0" stroke="#8d8d8d" stroke-width="1.5"/>
      <circle cx="140" cy="0" r="5" fill="#8d8d8d"/>
      <rect x="155" y="-12" width="90" height="24" fill="#262626" stroke="#6f6f6f" stroke-width="1"/>
      <text x="200" y="4" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#f4f4f4" text-anchor="middle">NODE_AP_04</text>
    </g>
    
    <g transform="rotate(270)">
      <line x1="0" y1="0" x2="140" y2="0" stroke="#8d8d8d" stroke-width="1.5"/>
      <circle cx="140" cy="0" r="5" fill="#8d8d8d"/>
      <rect x="155" y="-12" width="90" height="24" fill="#262626" stroke="#6f6f6f" stroke-width="1"/>
      <text x="200" y="4" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#f4f4f4" text-anchor="middle">NODE_US_02</text>
    </g>
  </g>
  
  <!-- Footer Telemetry -->
  <text x="45" y="405" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#6f6f6f">SCALE: 1:1,000,000 // PROTOCOL: ZERO_TRUST_FEDERATION</text>
  <text x="755" y="405" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#8d8d8d" text-anchor="end">STATUS: VERIFIED</text>
</svg>
