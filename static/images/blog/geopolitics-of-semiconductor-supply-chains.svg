<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#161616"/>
  <defs>
    <pattern id="grid5" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#262626" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#grid5)"/>
  
  <rect x="30" y="30" width="740" height="390" fill="none" stroke="#393939" stroke-width="1"/>
  <line x1="30" y1="70" x2="770" y2="70" stroke="#393939" stroke-width="1"/>
  <line x1="30" y1="380" x2="770" y2="380" stroke="#393939" stroke-width="1"/>
  
  <text x="45" y="55" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#8d8d8d" letter-spacing="1.5">FIG 05.3 // CRITICAL SILICON CHOKEPOINTS &amp; EUV FABRICATION</text>
  <text x="755" y="55" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#f4f4f4" text-anchor="end">FAB.EUV-2nm</text>
  
  <!-- Silicon Wafer / Microarchitecture Grid -->
  <g transform="translate(400, 225)">
    <!-- Wafer Silhouette -->
    <circle r="120" fill="#262626" stroke="#ffffff" stroke-width="2"/>
    <path d="M 85 -85 L 120 0 L 85 85" fill="none" stroke="#525252" stroke-width="1"/>
    
    <!-- Die Grid -->
    <g stroke="#393939" stroke-width="1">
      <line x1="-80" y1="-80" x2="-80" y2="80"/>
      <line x1="-40" y1="-100" x2="-40" y2="100"/>
      <line x1="0" y1="-120" x2="0" y2="120"/>
      <line x1="40" y1="-100" x2="40" y2="100"/>
      <line x1="80" y1="-80" x2="80" y2="80"/>
      
      <line x1="-80" y1="-80" x2="80" y2="-80"/>
      <line x1="-100" y1="-40" x2="100" y2="-40"/>
      <line x1="-120" y1="0" x2="120" y2="0"/>
      <line x1="-100" y1="40" x2="100" y2="40"/>
      <line x1="-80" y1="80" x2="80" y2="80"/>
    </g>
    
    <!-- Target Lithography Node -->
    <rect x="-20" y="-20" width="40" height="40" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="4" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="700" fill="#161616" text-anchor="middle">2nm</text>
    
    <!-- Coordinate vectors -->
    <line x1="-200" y1="-40" x2="-140" y2="-40" stroke="#8d8d8d" stroke-width="1.5"/>
    <circle cx="-140" cy="-40" r="4" fill="#8d8d8d"/>
    <text x="-210" y="-36" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#8d8d8d" text-anchor="end">ASML EUV (VELDHOVEN)</text>
    
    <line x1="140" y1="50" x2="200" y2="50" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="140" cy="50" r="4" fill="#ffffff"/>
    <text x="210" y="54" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#ffffff">TSMC FAB 20 (HSINCHU)</text>
  </g>
  
  <text x="45" y="405" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#6f6f6f">SUPPLY CHAIN: 100% DEPENDENCY // MONOPOLY INDEX: 0.94</text>
  <text x="755" y="405" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#8d8d8d" text-anchor="end">STRATEGY: CRITICAL</text>
</svg>
