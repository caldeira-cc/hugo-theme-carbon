<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#161616"/>
  <defs>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#262626" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#grid2)"/>
  
  <rect x="30" y="30" width="740" height="390" fill="none" stroke="#393939" stroke-width="1"/>
  <line x1="30" y1="70" x2="770" y2="70" stroke="#393939" stroke-width="1"/>
  <line x1="30" y1="380" x2="770" y2="380" stroke="#393939" stroke-width="1"/>
  
  <text x="45" y="55" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#8d8d8d" letter-spacing="1.5">FIG 02.4 // D'HONDT PROPORTIONAL QUOTIENT HEMICYCLE</text>
  <text x="755" y="55" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#f4f4f4" text-anchor="end">MATH.DHONDT-230</text>
  
  <!-- Parliamentary Hemicycle Arcs -->
  <g transform="translate(400, 310)">
    <!-- Base line -->
    <line x1="-240" y1="0" x2="240" y2="0" stroke="#525252" stroke-width="1.5"/>
    
    <!-- Concentric Seating Tiers -->
    <path d="M -80 0 A 80 80 0 0 1 80 0" fill="none" stroke="#393939" stroke-width="1"/>
    <path d="M -130 0 A 130 130 0 0 1 130 0" fill="none" stroke="#525252" stroke-width="1.5"/>
    <path d="M -180 0 A 180 180 0 0 1 180 0" fill="none" stroke="#8d8d8d" stroke-width="1.5"/>
    <path d="M -230 0 A 230 230 0 0 1 230 0" fill="none" stroke="#f4f4f4" stroke-width="2"/>
    
    <!-- Discrete Seats -->
    <!-- Tier 1 -->
    <circle cx="-56" cy="-56" r="4" fill="#ffffff"/>
    <circle cx="0" cy="-80" r="4" fill="#ffffff"/>
    <circle cx="56" cy="-56" r="4" fill="#ffffff"/>
    
    <!-- Tier 2 -->
    <circle cx="-120" cy="-50" r="4" fill="#8d8d8d"/>
    <circle cx="-92" cy="-92" r="4" fill="#8d8d8d"/>
    <circle cx="-50" cy="-120" r="4" fill="#ffffff"/>
    <circle cx="0" cy="-130" r="4" fill="#ffffff"/>
    <circle cx="50" cy="-120" r="4" fill="#ffffff"/>
    <circle cx="92" cy="-92" r="4" fill="#8d8d8d"/>
    <circle cx="120" cy="-50" r="4" fill="#8d8d8d"/>
    
    <!-- Tier 3 -->
    <circle cx="-166" cy="-70" r="4.5" fill="#525252"/>
    <circle cx="-127" cy="-127" r="4.5" fill="#8d8d8d"/>
    <circle cx="-70" cy="-166" r="4.5" fill="#ffffff"/>
    <circle cx="0" cy="-180" r="4.5" fill="#ffffff"/>
    <circle cx="70" cy="-166" r="4.5" fill="#ffffff"/>
    <circle cx="127" cy="-127" r="4.5" fill="#8d8d8d"/>
    <circle cx="166" cy="-70" r="4.5" fill="#525252"/>
    
    <!-- Tier 4 -->
    <circle cx="-212" cy="-90" r="5" fill="#393939"/>
    <circle cx="-162" cy="-162" r="5" fill="#8d8d8d"/>
    <circle cx="-90" cy="-212" r="5" fill="#ffffff"/>
    <circle cx="0" cy="-230" r="5" fill="#ffffff"/>
    <circle cx="90" cy="-212" r="5" fill="#ffffff"/>
    <circle cx="162" cy="-162" r="5" fill="#8d8d8d"/>
    <circle cx="212" cy="-90" r="5" fill="#393939"/>
    
    <!-- Speaker Rostrum -->
    <rect x="-25" y="-15" width="50" height="15" fill="#ffffff"/>
  </g>
  
  <text x="45" y="405" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#6f6f6f">EQUATION: Q(s) = V / (s + 1) // MANDATES: 230 SEATS</text>
  <text x="755" y="405" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#8d8d8d" text-anchor="end">CONVERGENCE: EXACT</text>
</svg>
