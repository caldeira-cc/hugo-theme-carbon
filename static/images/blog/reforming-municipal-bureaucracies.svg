<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#161616"/>
  <defs>
    <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#262626" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#grid3)"/>
  
  <rect x="30" y="30" width="740" height="390" fill="none" stroke="#393939" stroke-width="1"/>
  <line x1="30" y1="70" x2="770" y2="70" stroke="#393939" stroke-width="1"/>
  <line x1="30" y1="380" x2="770" y2="380" stroke="#393939" stroke-width="1"/>
  
  <text x="45" y="55" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#8d8d8d" letter-spacing="1.5">FIG 03.2 // MUNICIPAL TELEMETRY &amp; ADMINISTRATIVE REFORM</text>
  <text x="755" y="55" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#f4f4f4" text-anchor="end">CIVIC.WORKFLOW-v2</text>
  
  <!-- Flow Diagram Matrix -->
  <g transform="translate(100, 130)">
    <!-- Stage 1 -->
    <rect x="0" y="40" width="140" height="90" fill="#262626" stroke="#525252" stroke-width="1.5"/>
    <text x="15" y="70" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#8d8d8d">CITIZEN</text>
    <text x="15" y="90" font-family="'IBM Plex Sans', sans-serif" font-weight="600" font-size="14" fill="#ffffff">Direct Filing</text>
    <text x="15" y="110" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#6f6f6f">DIGITAL SIGNATURE</text>
    
    <!-- Vector Arrow 1 -->
    <line x1="140" y1="85" x2="220" y2="85" stroke="#ffffff" stroke-width="2"/>
    <polygon points="220,81 228,85 220,89" fill="#ffffff"/>
    
    <!-- Stage 2 -->
    <rect x="230" y="20" width="160" height="130" fill="#393939" stroke="#f4f4f4" stroke-width="2"/>
    <text x="245" y="50" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#8d8d8d">TELEMETRY BUS</text>
    <text x="245" y="75" font-family="'IBM Plex Sans', sans-serif" font-weight="600" font-size="14" fill="#ffffff">Automated Triage</text>
    <text x="245" y="95" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#c6c6c6">Open Observability</text>
    <text x="245" y="115" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#c6c6c6">SLO: &lt; 48 HOURS</text>
    
    <!-- Vector Arrow 2 -->
    <line x1="390" y1="85" x2="470" y2="85" stroke="#ffffff" stroke-width="2"/>
    <polygon points="470,81 478,85 470,89" fill="#ffffff"/>
    
    <!-- Stage 3 -->
    <rect x="480" y="40" width="140" height="90" fill="#262626" stroke="#525252" stroke-width="1.5"/>
    <text x="495" y="70" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#8d8d8d">MUNICIPAL</text>
    <text x="495" y="90" font-family="'IBM Plex Sans', sans-serif" font-weight="600" font-size="14" fill="#ffffff">Public Action</text>
    <text x="495" y="110" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#6f6f6f">AUDITABLE TRAIL</text>
  </g>
  
  <text x="45" y="405" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#6f6f6f">FRAMEWORK: OPEN_TELEMETRY_ADMINISTRATION // LATENCY: 0.12ms</text>
  <text x="755" y="405" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#8d8d8d" text-anchor="end">EFFICIENCY: +84%</text>
</svg>
