<div class="carbon-search-modal" id="carbon-search-modal" role="dialog" aria-modal="true" aria-label="Search website" aria-hidden="true">
  <div class="carbon-search-modal__dialog">
    <div class="carbon-search-modal__header">
      <input type="text" id="carbon-search-input" class="carbon-search-modal__input" placeholder="Search documentation, blog posts, and data..." autocomplete="off" aria-label="Search query">
      <button type="button" class="carbon-search-modal__close-btn js-close-search" aria-label="Close search dialog">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
          <path d="M12 4.7L11.3 4 8 7.3 4.7 4 4 4.7 7.3 8 4 11.3l.7.7L8 8.7l3.3 3.3.7-.7L8.7 8z"/>
        </svg>
      </button>
    </div>
    <ul class="carbon-search-modal__results" id="carbon-search-results">
      <li class="carbon-search-modal__empty">Type at least 2 characters to search across documentation, blog posts, and datasets.</li>
    </ul>
  </div>
</div>
