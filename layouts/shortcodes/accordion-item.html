{{ $title := .Get "title" }}
{{ $open := or (.Get "open") false }}
{{ $disabled := or (.Get "disabled") false }}
{{ $class := .Get "class" }}

<cds-accordion-item
  {{ with $title }}title="{{ . }}"{{ end }}
  {{ if or (eq $open "true") (eq $open true) }}open{{ end }}
  {{ if or (eq $disabled "true") (eq $disabled true) }}disabled{{ end }}
  {{ with $class }}class="{{ . }}"{{ end }}>
  {{ .Inner | markdownify }}
</cds-accordion-item>
