{{ $label := or (.Get "label") (.Get "title") "Contained List" }}
{{ $kind := .Get "kind" | default "on-page" }}
{{ $size := .Get "size" | default "lg" }}
{{ $class := .Get "class" }}

<cds-contained-list
  label="{{ $label }}"
  kind="{{ $kind }}"
  size="{{ $size }}"
  {{ with $class }}class="{{ . }}"{{ end }}>
  {{ .Inner }}
</cds-contained-list>
