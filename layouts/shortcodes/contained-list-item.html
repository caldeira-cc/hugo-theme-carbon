{{ $title := or (.Get "title") (.Get "label") }}
{{ $description := .Get "description" }}
{{ $href := .Get "href" }}
{{ $class := .Get "class" }}

<cds-contained-list-item
  {{ with $href }}href="{{ . }}"{{ end }}
  {{ with $class }}class="{{ . }}"{{ end }}>
  <div class="cds--contained-list__row-content">
    {{ with $title }}<span class="cds--contained-list__row-title">{{ . }}</span>{{ end }}
    {{ with $description }}<span class="cds--contained-list__row-description" style="display: block; font-size: 0.75rem; color: var(--cds-text-secondary);">{{ . }}</span>{{ end }}
  </div>
</cds-contained-list-item>
