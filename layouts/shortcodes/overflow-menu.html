{{ $items := .Get "items" }}
{{ $class := .Get "class" }}

<cds-overflow-menu {{ with $class }}class="{{ . }}"{{ end }}>
  <cds-overflow-menu-body>
    {{ if .Inner }}
      {{ .Inner }}
    {{ else if $items }}
      {{ range (split $items ",") }}
        <cds-overflow-menu-item>{{ strings.TrimSpace . }}</cds-overflow-menu-item>
      {{ end }}
    {{ end }}
  </cds-overflow-menu-body>
</cds-overflow-menu>
