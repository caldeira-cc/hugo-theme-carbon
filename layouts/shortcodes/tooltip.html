{{ $text := or (.Get "text") (.Get "content") }}
{{ $align := .Get "align" | default "top" }}
{{ $class := .Get "class" }}

<cds-tooltip align="{{ $align }}" {{ with $class }}class="{{ . }}"{{ end }}>
  <span class="cds--tooltip-trigger" style="border-bottom: 1px dotted var(--cds-border-strong-01); cursor: pointer;">
    {{ .Inner | markdownify }}
  </span>
  <cds-tooltip-content>{{ $text }}</cds-tooltip-content>
</cds-tooltip>
