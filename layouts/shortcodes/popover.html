{{ $trigger := .Get "trigger" | default "Open Popover" }}
{{ $align := .Get "align" | default "bottom" }}
{{ $open := or (eq (.Get "open") true) (eq (.Get "open") "true") false }}
{{ $class := .Get "class" }}

<cds-popover align="{{ $align }}" autoalign {{ if $open }}open{{ end }} {{ with $class }}class="{{ . }}"{{ end }}>
  <cds-button kind="secondary" size="sm" onclick="const p = this.closest('cds-popover'); if (p) p.open = !p.open;">
    {{ $trigger }}
  </cds-button>
  <cds-popover-content>
    <div style="padding: 1rem; color: var(--cds-text-primary); line-height: 1.45;">
      {{ .Inner | markdownify }}
    </div>
  </cds-popover-content>
</cds-popover>
