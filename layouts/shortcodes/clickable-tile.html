{{ $href := .Get "href" | default "#" }}
{{ $target := .Get "target" }}
{{ $title := .Get "title" }}
{{ $class := .Get "class" }}

<cds-clickable-tile
  href="{{ $href }}"
  {{ with $target }}target="{{ . }}" rel="noopener noreferrer"{{ end }}
  {{ with $class }}class="{{ . }}"{{ end }}>
  {{ with $title }}
    <h5 style="margin: 0 0 0.5rem 0; font-size: 1rem; color: var(--cds-text-primary);">{{ . }}</h5>
  {{ end }}
  <div style="font-size: 0.875rem; color: var(--cds-text-secondary); line-height: 1.45;">
    {{ .Inner | markdownify }}
  </div>
</cds-clickable-tile>
