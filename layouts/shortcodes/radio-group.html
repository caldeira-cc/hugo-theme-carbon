{{ $legend := or (.Get "legend-text") (.Get "legend") "Select Option" }}
{{ $name := .Get "name" | default (printf "radio-group-%d" .Ordinal) }}
{{ $orientation := .Get "orientation" | default "vertical" }}
{{ $class := .Get "class" }}

<cds-radio-button-group
  legend-text="{{ $legend }}"
  name="{{ $name }}"
  orientation="{{ $orientation }}"
  {{ with $class }}class="{{ . }}"{{ end }}>
  {{ .Inner }}
</cds-radio-button-group>
