{{ $align := .Get "align" | default "start" }}
{{ $size := .Get "size" | default "md" }}
{{ $disabled := or (.Get "disabled") false }}
{{ $class := .Get "class" }}

<cds-accordion
  align="{{ $align }}"
  size="{{ $size }}"
  {{ if or (eq $disabled "true") (eq $disabled true) }}disabled{{ end }}
  {{ with $class }}class="{{ . }}"{{ end }}>
  {{ .Inner }}
</cds-accordion>
