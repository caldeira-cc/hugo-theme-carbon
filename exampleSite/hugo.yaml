baseURL: "https://carbon.caldeira.cc/"
title: "Hugo Carbon — IBM Carbon Design System v11 Theme"
defaultContentLanguage: "en"
defaultContentLanguageInSubdir: false

languages:
  en:
    languageName: "English (UK)"
    languageCode: "en-GB"
    weight: 1
    title: "Hugo Carbon — IBM Carbon Design System v11 Theme"
    params:
      description: "Modular, zero-CDN Hugo theme implementing IBM Carbon Design System v11 with W3C CSVW data engine, MapLibre GL maps, and dual-style theming."
  pt:
    languageName: "Português"
    languageCode: "pt-PT"
    weight: 2
    title: "Hugo Carbon — Tema IBM Carbon Design System v11"
    params:
      description: "Tema modular para Hugo implementando o IBM Carbon Design System v11 com motor de dados W3C CSVW, mapas MapLibre GL e temas duplos."

taxonomies:
  category: categories
  tag: tags
  author: authors

permalinks:
  categories: "/categories/:slug/"
  tags: "/tags/:slug/"
  authors: "/authors/:slug/"

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - - "$$"
              - "$$"
            - - "\\["
              - "\\]"
          inline:
            - - "$"
              - "$"
            - - "\\("
              - "\\)"
  highlight:
    style: "monokai"
    lineNos: true
    guessSyntax: true
  tableOfContents:
    startLevel: 2
    endLevel: 4
    ordered: false

outputs:
  home:
    - HTML
    - JSON
    - RSS
  page:
    - HTML
  section:
    - HTML
    - RSS

params:
  environment: "carbon"
  assetsURL: ""

  carbon:
    useLocalFonts: true
    defaultThemeMode: "system"
    theme:
      lightVariant: "white"
      darkVariant: "g100"

  typography:
    content: "sans"
    headings: "sans"
    navbar: "sans"

  sidebars:
    left:
      enable: true
      defaultState: "expanded"
      sticky: true
    right:
      enable: true
      defaultState: "expanded"
      sticky: true

  mainBar:
    enable: true
    sticky: true
    widgets:
      clock:
        enable: true
        mode: "timezone"
        timezone: "UTC"
      date:
        enable: true
      availability:
        enable: true
        url: "#"
      themeSwitcher:
        enable: true
      search:
        enable: true
      location:
        enable: false
      weather:
        enable: false

  navigation:
    brand:
      title: "CARBON"
      description: "[Theme Engine]"
      logoUrl: "/assets/images/ibm-carbon-logo.svg"
    navbar:
      - title: "Overview"
        url: "/"
        icon: "Home20"
      - title: "Docs"
        url: "/docs/"
        icon: "Catalog20"
      - title: "Components"
        url: "/docs/carbon-components/"
        icon: "Application20"
      - title: "Showcase"
        url: "/docs/feature-showcase/"
        icon: "Portfolio20"
      - title: "Style Guide"
        url: "/style/"
        icon: "ColorPalette20"
      - title: "Data Explorer"
        url: "/data/"
        icon: "Table20"
      - title: "Dashboard"
        url: "/analytics/"
        icon: "Dashboard20"
      - title: "Shortcodes"
        url: "/docs/shortcodes/"
        icon: "Code20"

  social:
    - name: "GitHub"
      id: "github"
      url: "https://github.com/caldeira-cc/hugo-theme-carbon"
      handle: "caldeira-cc/hugo-theme-carbon"
      icon: "github"
    - name: "Carbon Design"
      id: "carbon"
      url: "https://carbondesignsystem.com/"
      handle: "IBM Carbon Design System"
      icon: "globe"
    - name: "IBM Design"
      id: "ibm"
      url: "https://www.ibm.com/design/language/"
      handle: "IBM Design Language"
      icon: "globe"

  footer:
    copyright: "Hugo Carbon Theme. Built with IBM Carbon Design System v11."
    compliance: "Compliant with WCAG 2.1 AA Standards & Zero External CDNs."
    columns:
      - title: "Documentation"
        links:
          - title: "Overview"
            url: "/"
          - title: "Technical Docs"
            url: "/docs/"
          - title: "75+ Components"
            url: "/docs/carbon-components/"
          - title: "Configuration"
            url: "/docs/configuration/"
      - title: "Showcase & Engines"
        links:
          - title: "Feature Showcase"
            url: "/docs/feature-showcase/"
          - title: "Style Guide"
            url: "/style/"
          - title: "Data Explorer"
            url: "/data/"
          - title: "Dashboard Analytics"
            url: "/analytics/"
      - title: "Standards & Legal"
        links:
          - title: "Privacy Policy"
            url: "/privacy-policy/"
          - title: "Terms of Service"
            url: "/terms/"
          - title: "Open Source Licenses"
            url: "/licenses/"
          - title: "Cookie Settings"
            url: "#"
            data_action: "open-settings"

module:
  mounts:
    - source: content
      target: content
    - source: ../layouts
      target: layouts
    - source: ../assets
      target: assets
    - source: ../static
      target: static
    - source: ../data
      target: data
    - source: ../i18n
      target: i18n
