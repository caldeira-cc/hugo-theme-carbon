name: "Hugo Carbon"
license: "Apache-2.0"
licenselink: "https://github.com/caldeira-cc/hugo-theme-carbon/blob/main/LICENSE"
description: "Modular, zero-CDN, token-driven static site theme implementing the IBM Carbon Design System v11 with W3C CSVW data analytics, GeoJSON cartography, KaTeX Plex math, and client-side encryption."
homepage: "https://github.com/caldeira-cc/hugo-theme-carbon"
demosite: "https://carbon.caldeira.cc"
tags:
  - "carbon-design-system"
  - "ibm-plex"
  - "data-analytics"
  - "csvw"
  - "geojson"
  - "katex"
  - "dark-mode"
  - "offline-first"
  - "responsive"

features:
  - "IBM Carbon Design System v11 (16-column 2x Grid, 8px mini-units, 4px baseline)"
  - "Dual-Style Theming (Light and Dark) with live browser switching and OS tracking"
  - "Per-domain custom color palette overrides and token injection"
  - "100% Offline-First / Zero-CDN with self-hosted IBM Plex WOFF2 fonts"
  - "W3C CSV on the Web (CSVW) tabular data engine with Web Worker processing"
  - "GPU-Accelerated MapLibre GL v4 GeoJSON vector maps (2D flat & 3D globe)"
  - "GNU PSPP / SPSS client-side statistical analysis suite"
  - "KaTeX mathematical typesetting mapped to IBM Plex Math"
  - "AES-256-GCM client-side encrypted secrets container"
  - "RFC 6350 vCard business cards with direct VCF download and offline QR codes"

min_hugo_version: "0.120.0"

author:
  name: "Hugo Carbon Contributors"
  homepage: "https://github.com/caldeira-cc/hugo-theme-carbon"
